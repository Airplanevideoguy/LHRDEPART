<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Airplane Video Guy – Heathrow Departures</title>

<style>
:root{
  --red:rgb(255,0,0);
  --airnav-bg:#151d1b;
  --white:#ffffff;
  --line:rgba(255,255,255,.30);

  /* Slimmer overall lower-third */
  --overlay-height:110px;
  --red-bar-height:28px;
  --logo-width:138px;
  --sponsor-width:255px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

/* Whole graphic is locked to the literal bottom edge */
.overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:var(--overlay-height);

  display:grid;
  grid-template-columns:
    var(--logo-width)
    minmax(0,1fr)
    var(--sponsor-width);

  margin:0;
  padding:0;
  background:transparent;
  color:var(--white);
}


/* LEFT LOGO BLOCK */
.logo-panel{
  width:100%;
  height:var(--overlay-height);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
  padding:8px 13px;
  background:var(--airnav-bg);
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  border-bottom:0;
  overflow:hidden;
}
.logo-panel img{
  display:block;
  width:auto;
  height:auto;
  max-width:80px;
  max-height:88px;
  margin:0;
  padding:0;
  object-fit:contain;
}

/* CENTRE */
.main-panel{
  min-width:0;
  height:var(--overlay-height);

  display:grid;
  grid-template-rows:
    var(--red-bar-height)
    calc(var(--overlay-height) - var(--red-bar-height));

  margin:0;
  padding:0;

  background:var(--airnav-bg);
  overflow:hidden;
}

/* RED STRIP */
.red-bar{
  width:100%;
  height:var(--red-bar-height);

  display:flex;
  align-items:center;
  justify-content:flex-start;

  gap:12px;

  margin:0;
  padding:0 14px;

  background:var(--red);
  color:var(--white);

  overflow:hidden;
}


.live-indicator{
  display:flex;
  align-items:center;
  gap:5px;
  flex:0 0 auto;
  font-size:15px;
  font-weight:800;
  line-height:1;
  letter-spacing:.4px;
  white-space:nowrap;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffffff;
  display:inline-block;
  animation:livePulse 1.6s ease-in-out infinite;
}

@keyframes livePulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.78)}
}

.location-title{
  min-width:0;

  display:flex;
  align-items:center;
  gap:7px;

  font-size:15px;
  line-height:1;
  font-weight:800;
  letter-spacing:.1px;
  white-space:nowrap;
}

.location-pin{
  width:13px;
  height:18px;
  flex:0 0 auto;
  fill:var(--white);
}

.socials{
  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:6px;

  flex:0 0 auto;

  font-size:15px;
  line-height:1;
  font-weight:700;
  white-space:nowrap;
}

.social-icon{
  display:block;
  width:17px;
  height:17px;
  fill:var(--white);
}

.social-divider{
  opacity:.8;
}

/*
  AIRNAV VIEWPORT

  The iframe itself is deliberately taller than the visible area.
  The container clips it at exactly the bottom of the overlay.
  This removes the spare dark strip beneath the visible AirNav data.
*/
.airnav-wrap{
  position:relative;

  width:100%;
  height:calc(var(--overlay-height) - var(--red-bar-height));

  margin:0;
  padding:0;

  overflow:hidden;
  background:var(--airnav-bg);
}

.airnav-wrap iframe{
  position:absolute;
  top:0;
  left:0;

  display:block;

  width:100%;
  height:120px;

  margin:0;
  padding:0;
  border:0;

  background:var(--airnav-bg);
}

/* RIGHT SPONSOR BLOCK */
.sponsor-panel{
  width:100%;
  height:var(--overlay-height);

  margin:0;
  padding:0;

  background:var(--airnav-bg);

  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  border-bottom:0;

  overflow:hidden;
}

.rotating-message{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  margin-left:auto;
  min-width:470px;
  height:100%;
  overflow:hidden;
}

.rotating-message .socials,
.rotating-message .membership-prompt{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  transition:opacity .45s ease, transform .45s ease;
}

.membership-prompt{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:15px;
  line-height:1;
  font-weight:800;
  letter-spacing:.15px;
  opacity:0;
  pointer-events:none;
}

.membership-star{
  font-size:13px;
  line-height:1;
}

.rotating-message.show-membership .socials{
  opacity:0;
  transform:translateY(-50%) translateX(-8px);
}

.rotating-message.show-membership .membership-prompt{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}


.support-prompt{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  font-size:13px;
  line-height:1;
  font-weight:800;
  letter-spacing:.1px;
  opacity:0;
  pointer-events:none;
}

.rotating-message .support-prompt{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  transition:opacity .45s ease, transform .45s ease;
}

.rotating-message.show-support .socials,
.rotating-message.show-support .membership-prompt{
  opacity:0;
  transform:translateY(-50%) translateX(-8px);
}

.rotating-message.show-support .support-prompt{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}


/* FOUR-WAY ROTATING VIEWER MESSAGES */
.rotating-message{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  margin-left:auto;
  min-width:470px;
  height:100%;
  overflow:hidden;
}

.rotating-message .socials,
.rotating-message .membership-prompt,
.rotating-message .support-prompt,
.rotating-message .chat-prompt{
  position:absolute;
  right:0;
  top:50%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  white-space:nowrap;
  font-size:15px;
  line-height:1;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transform:translateY(-50%) translateX(8px);
  transition:opacity .45s ease, transform .45s ease;
}

.rotating-message .socials{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}

.rotating-message.show-membership .socials,
.rotating-message.show-support .socials,
.rotating-message.show-chat .socials{
  opacity:0;
  transform:translateY(-50%) translateX(-8px);
}

.rotating-message.show-membership .membership-prompt,
.rotating-message.show-support .support-prompt,
.rotating-message.show-chat .chat-prompt{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}

.rotation-icon{
  width:18px;
  height:18px;
  display:block;
  fill:#ffffff;
  flex:0 0 auto;
}


.schedule-prompt,
.newhere-prompt{
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  font-size:15px;
  line-height:1;
  font-weight:800;
  letter-spacing:.1px;
  opacity:0;
  pointer-events:none;
}

.rotating-message .schedule-prompt,
.rotating-message .newhere-prompt{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%) translateX(8px);
  transition:opacity .45s ease, transform .45s ease;
}

.rotating-message.show-schedule .socials,
.rotating-message.show-schedule .membership-prompt,
.rotating-message.show-schedule .support-prompt,
.rotating-message.show-schedule .chat-prompt,
.rotating-message.show-newhere .socials,
.rotating-message.show-newhere .membership-prompt,
.rotating-message.show-newhere .support-prompt,
.rotating-message.show-newhere .chat-prompt{
  opacity:0;
  transform:translateY(-50%) translateX(-8px);
}

.rotating-message.show-schedule .schedule-prompt,
.rotating-message.show-newhere .newhere-prompt{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}

</style>
</head>

    }
  }

  setInterval(function () {
    state = (state + 1) % 6;
    setState(state);
  }, 20000);
})();
</script>
